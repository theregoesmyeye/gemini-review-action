name: Gemini Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for diff comparison on push

      - name: Gemini Code Review
        uses: theregoesmyeye/gemini-review-action@main
        with:
          geminiApiKey: ${{ secrets.GEMINI_API_KEY }}
          mode: 'auto'
          debug: true
