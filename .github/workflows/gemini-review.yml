name: Gemini Code Review

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Gemini Code Review
        uses: theregoesmyeye/gemini-review-action@main
        with:
          geminiApiKey: ${{ secrets.GEMINI_API_KEY }}
          debug: true
